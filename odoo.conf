[options]
; Database settings — adjust these to match your PostgreSQL setup
db_host = localhost
db_port = 5432
db_user = odoo
db_password = odoo
db_name = stocksense_db

; Addons paths — adjust the first path to your Odoo 17 installation
addons_path = k:\Projects\odoo17\addons,k:\Projects\StockSense

; Server settings
http_port = 8069
admin_passwd = admin

; Logging
log_level = info
